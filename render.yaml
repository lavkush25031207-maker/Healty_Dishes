services:
  - type: web
    name: healthy-dishes-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: CORS_ALLOWED_ORIGINS
        value: https://lavkush25031207-maker.github.io
      - key: DATABASE_URL
        fromDatabase:
          name: healthy-dishes-db
          property: connectionString

databases:
  - name: healthy-dishes-db
    plan: free
    region: singapore
    databaseName: healthy_dishes
    user: healthy_dishes_user
